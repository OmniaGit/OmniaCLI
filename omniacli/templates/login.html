<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · OmniaCLI</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
/* the colours of the image's own background, and the OmniaSolutions red */
:root { --edge: #EEF2F7; --ink: #161616; --muted: #6B6B6B; --line: #E5E5E5; --red: #DC2626; --red-dark: #991B1B;
  --font: "Helvetica Neue", Helvetica, Arial, "Nimbus Sans", "Liberation Sans", sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 15px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased;
  background: var(--edge) url("/login-background.jpg") no-repeat;
  background-size: min(100vh, 62vw) auto; background-position: 4vw center;
  display: flex; align-items: center; justify-content: flex-end; padding: 24px 6vw; }
.card { width: min(380px, 100%); background: rgba(255, 255, 255, .92); backdrop-filter: blur(6px);
  border: 1px solid var(--line); padding: 32px 30px 26px; box-shadow: 0 18px 50px rgba(10, 10, 10, .08); }
h1 { margin: 0 0 4px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
h1 span { color: var(--red); }
.lead { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 5px; }
input[type=text], input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #D4D4D4;
  background: #fff; color: var(--ink); }
input:focus { outline: 2px solid var(--red); outline-offset: -1px; border-color: var(--red); }
button { width: 100%; margin-top: 22px; padding: 12px; font: inherit; font-weight: 600; border: 0;
  background: var(--red); color: #fff; cursor: pointer; }
button:hover { background: var(--red-dark); }
.error { margin: 0 0 6px; padding: 9px 12px; border: 1px solid var(--red); color: var(--red-dark); background: #FEF2F2;
  font-size: 14px; }
.foot { margin: 18px 0 0; font-size: 12px; color: var(--muted); }
.foot a { color: var(--muted); }
@media (max-width: 760px) {
  /* the image above the form */
  body { background-size: min(70vw, 42vh) auto; background-position: center 16px;
    flex-direction: column; justify-content: flex-start; padding: calc(min(70vw, 42vh) + 24px) 16px 24px; }
}
</style>
</head>
<body>
<main class="card">
  <h1>Omnia<span>CLI</span></h1>
  <p class="lead">Deploy and operate your Odoo instances.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">User name</label>
    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button>Log in</button>
  </form>
  <p class="foot">© 2026 OmniaSolutions S.n.c di Boscolo Matteo &amp; C ·
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">GNU AGPL v3</a></p>
</main>
</body>
</html>
