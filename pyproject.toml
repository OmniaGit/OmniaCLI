[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "omniaci"
version = "2026.1.0"
description = "Web service to deploy and test Odoo instances"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
omniaci = "omniaci.cli:main"

[tool.setuptools]
packages = ["omniaci"]

[tool.setuptools.package-data]
omniaci = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
