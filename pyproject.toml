[build-system]
# 77: the license as an SPDX expression (PEP 639)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omniacli"
version = "2026.1.0"
description = "Web service to deploy and test Odoo instances"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "OmniaSolutions S.n.c di Boscolo Matteo & C"}]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # WebSockets: uvicorn serves the shell with it, the link proxy connects with it
    "websockets>=13",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # links to other OmniaCLI instances (proxy and server lists)
    "httpx>=0.27",
    # the MCP interface (/mcp); the SDK needs Python 3.10, older ones run without it
    "mcp>=2.3; python_version >= '3.10'",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
omniacli = "omniacli.cli:main"

[tool.setuptools]
# omniacli.odoo: the Odoo plugin, built in
packages = ["omniacli", "omniacli.odoo"]

[tool.setuptools.package-data]
omniacli = ["templates/*.html", "static/*"]
"omniacli.odoo" = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
