<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OmniaCI{% endblock %}</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085;
  --border: #d9dee7; --accent: #2457c5; --ok: #1f8a4c; --err: #c42b2b;
  --warn: #a86400; --code-bg: #0f1420; --code-text: #d6dbe4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151c; --panel: #1b2029; --text: #e3e7ee; --muted: #98a2b3;
    --border: #2d3442; --accent: #6d9bff; --ok: #4cc283; --err: #ff6b6b;
    --warn: #f0a443; --code-bg: #0b0e14; --code-text: #d6dbe4;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; gap: 20px; align-items: center; padding: 12px 20px;
  background: var(--panel); border-bottom: 1px solid var(--border); }
header strong { font-size: 16px; }
header a { color: var(--text); text-decoration: none; }
header a:hover { color: var(--accent); }
main { padding: 20px; max-width: 1400px; margin: 0 auto; }
a { color: var(--accent); }
h1 { font-size: 20px; margin: 0 0 16px; }
h2 { font-size: 17px; margin: 0; }
.server { background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 20px; }
.server-head { display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
.instances { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.instance { padding: 14px 16px; border-right: 1px solid var(--border); }
.instance:last-child { border-right: 0; }
.role { font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: .05em; }
.role.production { color: var(--err); } .role.test { color: var(--accent); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 10px 0; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border);
  vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
code, .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.actions form { margin: 0; }
button, .button { font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  text-decoration: none; display: inline-block; }
button:hover, .button:hover { border-color: var(--accent); color: var(--accent); }
button.danger { border-color: var(--err); color: var(--err); }
button:disabled { opacity: .5; cursor: not-allowed; }
.status { font-weight: 600; }
.status.success { color: var(--ok); } .status.failed, .status.interrupted, .error { color: var(--err); }
.status.running, .status.queued { color: var(--warn); }
.muted { color: var(--muted); }
pre.console { background: var(--code-bg); color: var(--code-text); padding: 12px;
  border-radius: 6px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  margin: 0; font-size: 12.5px; line-height: 1.4; }
pre.console .ERROR, pre.console .CRITICAL { color: #ff7b7b; }
pre.console .WARNING { color: #f0c060; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
@media (max-width: 700px) {
  main { padding: 16px; }
  .instances { grid-template-columns: 1fr; }
  .instance { border-right: 0; border-bottom: 1px solid var(--border); }
  .scroll { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <strong><a href="/">OmniaCI</a></strong>
  <a href="/">Servers</a>
  <a href="/jobs">Jobs</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
