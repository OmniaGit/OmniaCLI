<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OmniaCI{% endblock %}</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
:root {
  --series-1: #2a78d6;
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085;
  --border: #d9dee7; --accent: #2457c5; --ok: #1f8a4c; --err: #c42b2b;
  --warn: #a86400; --code-bg: #0f1420; --code-text: #d6dbe4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151c; --panel: #1b2029; --text: #e3e7ee; --muted: #98a2b3;
    --border: #2d3442; --accent: #6d9bff; --ok: #4cc283; --err: #ff6b6b;
    --warn: #f0a443; --code-bg: #0b0e14; --code-text: #d6dbe4;
    --series-1: #3987e5;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 12px 20px;
  background: var(--panel); border-bottom: 1px solid var(--border); }
header strong { font-size: 16px; }
header a { color: var(--text); text-decoration: none; }
header a:hover { color: var(--accent); }
main { padding: 20px; max-width: 1400px; margin: 0 auto; }
a { color: var(--accent); }
h1 { font-size: 20px; margin: 0 0 16px; }
h2 { font-size: 17px; margin: 0; }
.server { background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 20px; }
.server-head { display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
.instances { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.instance { padding: 14px 16px; border-right: 1px solid var(--border); }
.instance:last-child { border-right: 0; }
.role { font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: .05em; }
.role.production { color: var(--err); } .role.test { color: var(--accent); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 10px 0; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border);
  vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
code, .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.actions form { margin: 0; }
button, .button { font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  text-decoration: none; display: inline-block; }
button:hover, .button:hover { border-color: var(--accent); color: var(--accent); }
button.danger { border-color: var(--err); color: var(--err); }
button:disabled { opacity: .5; cursor: not-allowed; }
.status { font-weight: 600; }
.status.success { color: var(--ok); } .status.failed, .status.interrupted, .error { color: var(--err); }
.status.running, .status.queued { color: var(--warn); }
.muted { color: var(--muted); }
pre.console { background: var(--code-bg); color: var(--code-text); padding: 12px;
  border-radius: 6px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  margin: 0; font-size: 12.5px; line-height: 1.4; }
pre.console .ERROR, pre.console .CRITICAL { color: #ff7b7b; }
pre.console .WARNING { color: #f0c060; }
.form-grid { display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; align-items: center; }
.form-grid label { color: var(--muted); }
.with-button { display: flex; gap: 8px; }
.conf-notes { margin-top: 10px; font-size: 13px; } .conf-notes p { margin: 2px 0; }
input[type=text], input[type=number], input[type=search], select { font: inherit; padding: 5px 8px; width: 100%;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
.job-filter select, .job-filter input { width: auto; } .job-filter input { min-width: min(16em, 100%); }
fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 0 0 16px; padding: 12px 16px; }
legend { padding: 0 6px; }
.repos td { padding: 4px; } .repos input { min-width: 90px; }
.banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; border: 1px solid var(--err); color: var(--err); }
dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
  color: var(--text); width: min(640px, calc(100vw - 32px)); padding: 18px 20px; }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.addon-list { max-height: 45vh; overflow: auto; border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; margin-bottom: 10px; }
.addon-group { font-weight: 600; color: var(--muted); margin: 8px 0 4px; font-size: 12px;
  text-transform: uppercase; letter-spacing: .04em; }
.addon { display: block; padding: 2px 0; font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
.instance-grid { display: grid; gap: 16px; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.tile-label { color: var(--muted); font-size: 12px; }
.tile-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart-title { font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
.chart-box { position: relative; }
svg.chart { width: 100%; height: 160px; display: block; }
svg.spark { width: 160px; height: 28px; display: block; }
.chart-line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-area { fill: var(--series-1); opacity: .1; stroke: none; }
.chart-dot { fill: var(--series-1); stroke: var(--panel); stroke-width: 2; }
.chart-grid { stroke: var(--border); stroke-width: 1; }
.chart-cross { stroke: var(--muted); stroke-width: 1; }
.chart-axis, .chart-empty { fill: var(--muted); font-size: 11px; }
.chart-tip { position: absolute; top: -6px; transform: translateX(-50%); background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; white-space: nowrap;
  pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.sparks { min-width: 230px; }
.spark-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
.spark-row .role { width: 34px; font-size: 11px; }
.spark-value { width: 40px; text-align: right; color: var(--text); }
.server-rows td { vertical-align: middle; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
.badge.active { color: var(--ok); border-color: var(--ok); }
.badge.draft { color: var(--warn); border-color: var(--warn); }
.button.current { border-color: var(--accent); color: var(--accent); font-weight: 600; }
summary { cursor: pointer; color: var(--muted); }
@media (max-width: 1000px) { .instance-grid { grid-template-columns: 1fr; } }
.crumbs ol { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 14px; padding: 0;
  font-size: 13px; color: var(--muted); }
.crumbs li + li::before { content: "›"; margin-right: 6px; }
.crumbs a { color: var(--accent); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs [aria-current] { color: var(--text); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
@media (max-width: 700px) {
  main { padding: 16px; }
  .instances { grid-template-columns: 1fr; }
  .instance { border-right: 0; border-bottom: 1px solid var(--border); }
  .scroll { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <strong><a href="{{ prefix }}/">OmniaCI</a></strong>
  <a href="{{ prefix }}/">Servers</a>
  <a href="{{ prefix }}/jobs">Jobs</a>
  {% if is_admin %}<a href="{{ prefix }}/config">Configuration</a>
  <a href="{{ prefix }}/users">Users</a>{% endif %}
  {% if account %}<a href="{{ prefix }}/account" style="margin-left: auto" title="Your account and password">{{ account }}</a>{% endif %}
</header>
<main>
{% block crumbs %}{% endblock %}
{% block content %}{% endblock %}
</main>
</body>
</html>
