{% extends "base.html" %}
{% block title %}Log {{ instance.key }} · OmniaCI{% endblock %}
{% block content %}
<h1>Log {{ instance.key }} <span class="muted mono">{{ instance.log_file }}</span></h1>
<div class="panel">
  <div class="actions" style="margin: 0 0 10px">
    <label><input type="checkbox" id="errors"> Errors only (ERROR, CRITICAL and their tracebacks)</label>
    <label><input type="checkbox" id="follow" checked> Follow</label>
    <span id="state" class="muted"></span>
  </div>
  <pre class="console" id="out" style="height: 70vh"></pre>
</div>
{% include "_logview.html" %}
<script>
OmniaLog.attach(document.getElementById("out"), "/api/servers/{{ instance.server }}/{{ instance.role }}/log", {
  errorsOnly: document.getElementById("errors"),
  follow: document.getElementById("follow"),
  state: document.getElementById("state"),
});
</script>
{% endblock %}
