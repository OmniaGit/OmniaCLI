#
# A published GitHub release builds the Debian package of its tag and attaches
# it to the release: omniacli_<version>_all.deb, and OmniaCLI.deb, whose link
# never changes (releases/latest/download/OmniaCLI.deb).
#
# The tag is the version: omniacli-v<year>.1.<n> (or v<year>.1.<n>).
# Run by hand (Actions > Release > Run workflow) with the tag of an existing
# release, it builds and attaches that release's package again.
# The tests run first; the package is then installed and checked in Debian 12
# and Ubuntu 24.04 containers with systemd (packaging/debian/test_deb.sh).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to build, e.g. omniacli-v2026.1.7"
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[test]'
      - name: Tests
        run: pytest -q

  package:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version from the tag
        id: version
        run: |
          version="${TAG#omniacli-v}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]{4}\.1\.[0-9]+$ ]] || { echo "tag $TAG is not omniacli-v<year>.1.<n>"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the package
        env:
          PYTHON: python
        run: packaging/debian/build_deb.sh --ci "${{ steps.version.outputs.version }}" dist
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "dist/omniacli_${VERSION}_all.deb" dist/OmniaCLI.deb
          gh release upload "$TAG" "dist/omniacli_${VERSION}_all.deb" dist/OmniaCLI.deb --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/omniacli_${{ steps.version.outputs.version }}_all.deb

  install-test:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Install and check in containers with systemd
        run: packaging/debian/test_deb.sh dist/omniacli_${{ needs.package.outputs.version }}_all.deb debian:12 ubuntu:24.04
