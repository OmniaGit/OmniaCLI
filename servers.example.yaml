# OmniaCLI servers. Normally edited from the web interface (Configuration);
# the file named by servers_file in the main config.

servers:
  customer_a:
    production:
      database: CUSTOMER_A
      odoo_config: /opt/odoo/customer_a/prod/odoo.conf
      log_file: /var/log/odoo/customer_a_prod.log
      # bin of the venv that runs this Odoo; click-odoo-contrib must be
      # installed in it (pip install click-odoo-contrib)
      venv_bin: /opt/odoo/venvs/odoo18/bin
      # odoo-bin, for the update of chosen modules; omitted: the odoo-bin found
      # at the root of one of the repositories below
      odoo_bin: /opt/odoo/customer_a/prod/odoo/odoo-bin
      # the system user the venv's programs run as (sudo -n -u): the user of
      # the Odoo service, for its database login, filestore and venv;
      # omitted: the user running OmniaCLI. See README, Permissions
      run_as: odoo
      restart:
        type: systemd          # systemd -> systemctl restart <service>
        service: odoo-customer-a
        sudo: true             # run as "sudo -n": see README, sudoers
      update_modules: true     # click-odoo-update after every pull
      auto_update:
        enabled: false
        interval_minutes: 10
        window: "20:00-06:00"  # HH:MM-HH:MM, may cross midnight; omit = always
      repositories:
        # "name" pairs a test repository with its production repository
        - name: odoo
          path: /opt/odoo/customer_a/prod/odoo
          remote: origin
          branch: "18.0"
        - name: odooplm
          path: /opt/odoo/customer_a/prod/odooplm
          branch: "18.0"
    test:
      database: CUSTOMER_A_TEST
      odoo_config: /opt/odoo/customer_a/test/odoo.conf
      log_file: /var/log/odoo/customer_a_test.log
      venv_bin: /opt/odoo/venvs/odoo18/bin
      restart:
        type: initd            # initd -> /etc/init.d/<service> restart
        service: odoo-customer-a-test
      auto_update:
        enabled: true
        interval_minutes: 10
        window: "07:00-20:00"
      repositories:
        - name: odoo
          path: /opt/odoo/customer_a/test/odoo
          branch: "18.0"
        - name: odooplm
          path: /opt/odoo/customer_a/test/odooplm
          branch: "test_18.0"
