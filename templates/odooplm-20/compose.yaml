# OdooPLM 20 (DockerOdooPLM image) and PostgreSQL 17: a template of OmniaCLI's
# workspaces (docs/workspaces.md). OmniaCLI writes .env (the variables below)
# and config/odoo.conf; filestore and database are folders of the instance,
# on its workspace's disk; the ports listen on this machine only, the network
# is one OmniaCLI's firewall knows (SUBNET).
name: ${PROJECT}
networks:
  default:
    ipam:
      config:
        - subnet: ${SUBNET}
services:
  odoo:
    image: ${IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT}:8069"
      - "127.0.0.1:${WEBSOCKET_PORT}:8072"
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${DB_PASSWORD}
      # OmniaCLI creates the database itself (a job), not the image's entrypoint
      ODOOPLM_AUTO_INIT: "0"
    volumes:
      - ./data/filestore:/var/lib/odoo
      - ./config:/etc/odoo:ro
      - ../addons:/mnt/customer-addons:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
